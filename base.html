<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Fashion Hub{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="nav">
  <a class="logo" href="/">Fashion Hub</a>
  <nav>
    <a href="/#shop">Shop</a>
    <a href="/faq">FAQ</a>
    <a href="/order">Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
  <p>Fashion Hub, jewelry made to be noticed.</p>
  <p><a href="/faq">FAQ</a> &nbsp; <a href="/privacy">Privacy Policy</a> &nbsp; Instagram: @fashionhub</p>
</footer>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
