<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fashion Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="index">
<div id="nav"></div>
<main>
<section class="hero">
  <h1>Jewelry that feels like you.</h1>
  <p>Handpicked earrings, rings and necklaces for everyday and special days.</p>
  <a class="btn" href="#shop">Shop the collection</a>
</section>
<section id="shop" class="wrap">
  <h2>Our collection</h2>
  <div class="grid" id="products"></div>
</section>
<section class="wrap" id="reviews">
  <h2>What our customers say</h2>
  <div class="grid" id="reviews-list"></div>
  <form id="review-form" class="narrow">
    <h3>Share your experience</h3>
    <input name="name" placeholder="Your name" required>
    <select name="rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select>
    <textarea name="comment" placeholder="Write your review" required></textarea>
    <button class="btn" type="submit">Submit review</button>
  </form>
</section>
</main>
<div id="foot"></div>
<script src="app.js"></script>
</body>
</html>
