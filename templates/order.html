{% extends "base.html" %}
{% block title %}Your Order - Fashion Hub{% endblock %}
{% block content %}
<section class="wrap narrow" id="order-page">
  <h2>Your order</h2>
  <div id="order-items"></div>
  <p class="total">Total: Rs <span id="total">0</span></p>
  <form id="order-form">
    <input name="name" placeholder="Full name" required>
    <input name="phone" placeholder="Phone number" required>
    <textarea name="address" placeholder="Full delivery address" required></textarea>
    <p class="note">Payment: Cash on Delivery</p>
    <button class="btn" type="submit">Place order</button>
  </form>
</section>
{% endblock %}
